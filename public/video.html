<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Avolta Client Visit Intro Video</title>


<meta property="og:title" content="Avolta Client Visit Intro Video">
<meta property="og:description" content="Watch the Avolta client visit intro video.">
<meta property="og:type" content="video.other">
 
<meta property="og:url" content="https://changepond.com/avolta/video.html">
 
<meta property="og:image" content="https://changepond.com/avolta/in-flight-magazine/assets/video/Thumbnail.png">

<meta property="og:video" content="https://changepond.com/avolta/in-flight-magazine/assets/video/video.mp4">

<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1920">
<meta property="og:video:height" content="1080">
 
<!-- Twitter / WhatsApp support -->
<meta name="twitter:card" content="player">
<meta name="twitter:title" content="Avolta Client Visit Intro Video">
<meta name="twitter:description" content="Watch the Avolta client visit intro video.">
https://changepond.com/avolta/in-flight-magazine/assets/video/Thumbnail.png">


  <link rel="icon" type="image/jpeg" href="assets/images/cp_logo_fav_iccon.jfif">
  <style>
    :root {
      --intro-primary: #6eaeea;
      --intro-primary-dark: #3f7fbf;
    }

    body {
      margin: 0;
      background: #000;
      min-height: 100vh;
      font-family: "Source Sans 3", sans-serif;
      overflow: hidden;
    }

    .video-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0.96;
      filter: saturate(1.02) contrast(1.03);
    }

    .end-thumb {
      position: absolute;
      inset: 0;
      background: #000 url("assets/video/Thumbnail.png") center / contain no-repeat;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease;
    }

    .video-wrap.initial-thumb .end-thumb,
    .video-wrap.video-ended .end-thumb,
    .video-wrap.video-fallback .end-thumb {
      opacity: 1;
    }

    .video-wrap.initial-thumb .bg-video,
    .video-wrap.video-fallback .bg-video,
    .video-wrap.video-ended .bg-video {
      display: none;
    }

    .video-play-center {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 8;
      pointer-events: none;
    }

    .video-play-btn {
      width: 86px;
      height: 86px;
      border-radius: 999px;
      border: 1px solid rgba(210, 230, 247, 0.8);
      background: rgba(233, 246, 255, 0.88);
      color: #1c4167;
      box-shadow: 0 16px 28px rgba(20, 39, 59, 0.3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .video-play-btn svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
      margin-left: 2px;
    }

    .video-end-actions {
      position: fixed;
      left: 50%;
      top: calc(50% + 82px);
      transform: translateX(-50%);
      z-index: 10;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(9, 18, 30, 0.28);
      backdrop-filter: blur(8px);
    }

    .video-action-btn {
      border: 1px solid rgba(195, 221, 244, 0.8);
      background: rgba(237, 248, 255, 0.92);
      color: #1c4167;
      border-radius: 12px;
      min-height: 40px;
      padding: 0 14px;
      font: 700 0.9rem "Source Sans 3", sans-serif;
      cursor: pointer;
    }

    .video-action-btn-primary {
      background: linear-gradient(135deg, var(--intro-primary) 0%, var(--intro-primary-dark) 100%);
      color: #102b46;
      border-color: rgba(194, 222, 247, 0.8);
    }

    .video-audio-controls {
      position: fixed;
      right: clamp(14px, 2.4vw, 26px);
      top: clamp(14px, 2.8vh, 24px);
      z-index: 12;
    }

    .video-audio-btn {
      border: 1px solid rgba(195, 221, 244, 0.8);
      background: rgba(237, 248, 255, 0.92);
      color: #1c4167;
      border-radius: 999px;
      width: 42px;
      height: 42px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .video-audio-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .video-audio-btn .icon-muted {
      display: none;
    }

    .video-audio-btn.is-muted .icon-muted {
      display: block;
    }

    .video-audio-btn.is-muted .icon-unmuted {
      display: none;
    }

    .video-wrap.initial-thumb .video-play-center {
      display: grid;
    }

    .video-wrap:not(.initial-thumb) .video-play-center {
      display: none;
    }

    .video-wrap.video-ended .video-end-actions,
    .video-wrap.video-fallback .video-end-actions {
      display: flex;
    }

  </style>
</head>
<body>
  <div class="video-wrap initial-thumb" id="videoWrap">
    <video
      class="bg-video"
      id="sharedVideo"
      playsinline
      preload="metadata"
      poster="https://www.changepond.com/avolta/in-flight-magazine/assets/video/Thumbnail.png"
      aria-hidden="true"
    >
      <source src="https://www.changepond.com/avolta/in-flight-magazine/assets/video/avolta client.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="end-thumb" aria-hidden="true"></div>
    <div class="video-play-center">
      <button type="button" class="video-play-btn" id="playVideoButton" aria-label="Play intro video" title="Play intro video">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6v12l10-6z"></path>
        </svg>
      </button>
    </div>
    <div class="video-end-actions" id="videoEndActions">
      <button type="button" class="video-action-btn video-action-btn-primary" id="playAgainButton">Replay</button>
    </div>
    <div class="video-audio-controls">
      <button type="button" class="video-audio-btn is-muted" id="toggleMuteButton" aria-label="Unmute video" title="Unmute video">
        <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
          <path d="M15 9c1.5 1 1.5 5 0 6"></path>
          <path d="M18 7c3 2 3 8 0 10"></path>
        </svg>
        <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
          <path d="m15 9 5 6"></path>
          <path d="m20 9-5 6"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const videoWrap = document.getElementById("videoWrap");
    const video = document.getElementById("sharedVideo");
    const playButton = document.getElementById("playVideoButton");
    const playAgainButton = document.getElementById("playAgainButton");
    const toggleMuteButton = document.getElementById("toggleMuteButton");

    if (videoWrap && video && playButton && playAgainButton && toggleMuteButton) {
      let isMuted = true;

      const setStage = (stage) => {
        videoWrap.classList.remove("initial-thumb", "playing", "video-ended", "video-fallback");
        if (stage === "initial") videoWrap.classList.add("initial-thumb");
        if (stage === "playing") videoWrap.classList.add("playing");
        if (stage === "ended") videoWrap.classList.add("video-ended");
        if (stage === "fallback") videoWrap.classList.add("video-fallback");
      };

      const syncMuteButton = () => {
        toggleMuteButton.classList.toggle("is-muted", isMuted);
        toggleMuteButton.setAttribute("aria-label", isMuted ? "Unmute video" : "Mute video");
        toggleMuteButton.setAttribute("title", isMuted ? "Unmute video" : "Mute video");
      };

      const playFromStart = async () => {
        setStage("playing");
        try {
          video.load();
          video.currentTime = 0;
          video.muted = isMuted;
          await video.play();
        } catch (_error) {
          try {
            video.muted = isMuted;
            await video.play();
          } catch (_retryError) {
            setStage("fallback");
          }
        }
      };

      video.addEventListener("ended", () => setStage("ended"));
      video.addEventListener("error", () => setStage("fallback"));

      playButton.addEventListener("click", playFromStart);
      playAgainButton.addEventListener("click", playFromStart);
      toggleMuteButton.addEventListener("click", () => {
        isMuted = !isMuted;
        video.muted = isMuted;
        syncMuteButton();
      });

      video.muted = isMuted;
      syncMuteButton();
      setStage("initial");
    }
  </script>
</body>
</html>
