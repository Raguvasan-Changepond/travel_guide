<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Guide</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=20260220-ui30">
    <style>
        :root {
            --login-primary: #6eaeea;
            --login-primary-dark: #3f7fbf;
            --login-text: #1f4164;
            --login-muted: #5f7f9d;
            --login-field: rgba(245, 251, 255, 0.84);
            --login-border: rgba(156, 191, 225, 0.58);
            --login-field-focus: rgba(236, 246, 255, 0.96);
            --login-brand-font: "Ethnocentric", "Ethnocentric Rg", "Orbitron", "Trebuchet MS", sans-serif;
            --login-title-size: clamp(1.45rem, 2.2vw, 1.85rem);
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background:
                linear-gradient(132deg, rgba(233, 242, 252, 0.56) 0%, rgba(196, 219, 243, 0.48) 52%, rgba(165, 202, 236, 0.42) 100%),
                url("assets/images/change-pond.webp") center / cover no-repeat fixed;
            margin: 0;
            padding: 24px;
            font-family: "Source Sans 3", sans-serif;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(152, 197, 238, 0.36) 0%, rgba(152, 197, 238, 0) 72%);
            pointer-events: none;
            filter: blur(2px);
        }

        body::before {
            top: -110px;
            right: -80px;
        }

        body::after {
            bottom: -140px;
            left: -90px;
        }

        .login-container {
            position: relative;
            width: min(460px, 100%);
            padding: clamp(1.1rem, 2vw, 1.45rem);
            background: linear-gradient(148deg, rgba(255, 255, 255, 0.82) 0%, rgba(244, 250, 255, 0.72) 100%);
            border: 1px solid rgba(168, 198, 228, 0.56);
            border-radius: 22px;
            box-shadow: 0 22px 44px rgba(72, 112, 153, 0.24);
            backdrop-filter: blur(10px) saturate(1.06);
            animation: cardIn 420ms ease-out;
        }

        .login-header {
            padding: 0 0 16px;
            display: grid;
            gap: 6px;
            justify-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(172, 201, 230, 0.52);
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: #1e4468;
            margin: 0;
            font-size: var(--login-title-size);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.045em;
            font-family: var(--login-brand-font);
            text-shadow: 0 8px 18px rgba(194, 218, 241, 0.66);
        }

        .login-subtitle {
            margin: 0;
            color: #496887;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .error-message {
            display: none;
            margin: 0 0 14px;
            background: rgba(253, 238, 241, 0.9);
            color: #bf2b44;
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid #f4c6ce;
            animation: slideDown 220ms ease;
            box-shadow: 0 8px 20px rgba(10, 18, 30, 0.22);
        }

        .error-message.show {
            display: block;
        }

        #loginForm {
            display: grid;
            gap: 14px;
        }

        .form-group {
            margin: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--login-text);
            font-weight: 700;
            font-size: 0.77rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: none;
        }

        .form-group input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--login-border);
            border-radius: 14px;
            font-size: 1rem;
            font-family: "Source Sans 3", sans-serif;
            color: var(--login-text);
            background: var(--login-field);
            transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.65),
                0 10px 20px rgba(93, 134, 173, 0.2);
        }

        .form-group input::placeholder {
            color: var(--login-muted);
            opacity: 0.95;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(110, 174, 234, 0.9);
            background: var(--login-field-focus);
            box-shadow:
                0 0 0 4px rgba(159, 202, 240, 0.32),
                0 12px 22px rgba(93, 134, 173, 0.22);
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-dark) 100%);
            color: #102b46;
            border: 1px solid rgba(173, 207, 238, 0.72);
            border-radius: 14px;
            font-size: 1.03rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
            font-family: "Source Sans 3", sans-serif;
            box-shadow: 0 14px 28px rgba(84, 133, 181, 0.32);
            letter-spacing: 0.03em;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(84, 133, 181, 0.38);
            filter: brightness(1.05);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 9px 18px rgba(84, 133, 181, 0.3);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 820px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 0.75rem;
                border-radius: 18px;
            }

            .login-header {
                padding: 0 0 14px;
            }

            .login-header h1 {
                font-size: var(--login-title-size);
            }

            .error-message {
                margin: 0 0 12px;
            }

            .form-group input {
                height: 52px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Travel Guide</h1>
            <p class="login-subtitle">Sign in to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter your username" 
                    required
                    autocomplete="username"
                    maxlength="15"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                    maxlength="15"
                >
            </div>

            <button type="submit" class="login-button">Sign In</button>
        </form>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
