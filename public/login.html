<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Guide</title>
    <meta property="og:title" content="Travel Guide - Login">
    <meta property="og:description" content="Sign in to Travel Guide and start your journey.">
    <meta property="og:image" content="/assets/video/Thumbnail.png">
    <meta property="og:url" content="/login.html">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/jpeg" href="assets/images/cp_logo_fav_iccon.jfif">
    <link rel="stylesheet" href="assets/css/styles.css?v=20260226-responsive1">
    <style>
        :root {
            --login-primary: #6eaeea;
            --login-primary-dark: #3f7fbf;
            --login-text: #1f4164;
            --login-muted: #5f7f9d;
            --login-field: rgba(245, 251, 255, 0.84);
            --login-border: rgba(156, 191, 225, 0.58);
            --login-field-focus: rgba(236, 246, 255, 0.96);
            --login-brand-font: "Ethnocentric", "Ethnocentric Rg", "Orbitron", "Trebuchet MS", sans-serif;
            --login-title-size: clamp(1.45rem, 2.2vw, 1.85rem);
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background:
                linear-gradient(132deg, rgba(233, 242, 252, 0.56) 0%, rgba(196, 219, 243, 0.48) 52%, rgba(165, 202, 236, 0.42) 100%),
                url("assets/video/Thumbnail.png") center / cover no-repeat fixed;
            margin: 0;
            padding: 24px;
            font-family: "Source Sans 3", sans-serif;
            position: relative;
            overflow: hidden;
        }

        .login-video-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #000000;
            overflow: hidden;
        }

        .login-bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            opacity: 0.96;
            filter: saturate(1.02) contrast(1.03);
        }

        .login-end-thumb {
            position: absolute;
            inset: 0;
            background: #000000 url("assets/video/Thumbnail.png") center / contain no-repeat;
            opacity: 0;
            pointer-events: none;
            transition: opacity 260ms ease;
        }

        .login-video-wrap.initial-thumb .login-end-thumb,
        .login-video-wrap.video-ended .login-end-thumb,
        .login-video-wrap.video-fallback .login-end-thumb {
            opacity: 1;
        }

        .login-video-wrap.initial-thumb .login-bg-video,
        .login-video-wrap.video-fallback .login-bg-video,
        .login-video-wrap.video-ended .login-bg-video {
            display: none;
        }

        .video-play-center {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 8;
            pointer-events: none;
        }

        .video-play-btn {
            width: 86px;
            height: 86px;
            border-radius: 999px;
            border: 1px solid rgba(210, 230, 247, 0.8);
            background: rgba(233, 246, 255, 0.88);
            color: #1c4167;
            box-shadow: 0 16px 28px rgba(20, 39, 59, 0.3);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 200ms ease, box-shadow 200ms ease, background-color 200ms ease;
            pointer-events: auto;
        }

        .video-play-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 20px 30px rgba(20, 39, 59, 0.34);
            background: rgba(239, 250, 255, 0.95);
        }

        .video-play-btn svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
            margin-left: 2px;
        }

        .video-end-actions {
            position: fixed;
            left: 50%;
            top: calc(50% + 82px);
            bottom: auto;
            transform: translateX(-50%);
            z-index: 10;
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 999px;
            background: rgba(9, 18, 30, 0.28);
            backdrop-filter: blur(8px);
        }

        .video-action-btn {
            border: 1px solid rgba(195, 221, 244, 0.8);
            background: rgba(237, 248, 255, 0.92);
            color: #1c4167;
            border-radius: 12px;
            min-height: 40px;
            padding: 0 14px;
            font: 700 0.9rem "Source Sans 3", sans-serif;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(20, 39, 59, 0.26);
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }

        .video-action-btn:hover {
            transform: translateY(-1px);
            background: rgba(244, 252, 255, 0.97);
            box-shadow: 0 14px 24px rgba(20, 39, 59, 0.3);
        }

        .video-action-btn-continue {
            background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-dark) 100%);
            color: #102b46;
            border-color: rgba(194, 222, 247, 0.8);
        }

        .video-audio-controls {
            position: fixed;
            right: clamp(14px, 2.4vw, 26px);
            top: clamp(14px, 2.8vh, 24px);
            z-index: 12;
        }

        .video-audio-btn {
            border: 1px solid rgba(195, 221, 244, 0.8);
            background: rgba(237, 248, 255, 0.92);
            color: #1c4167;
            border-radius: 999px;
            width: 42px;
            height: 42px;
            padding: 0;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(20, 39, 59, 0.26);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease, color 180ms ease;
        }

        .video-audio-btn:hover {
            transform: translateY(-1px);
            background: rgba(244, 252, 255, 0.97);
            box-shadow: 0 14px 24px rgba(20, 39, 59, 0.3);
        }

        .video-audio-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .video-audio-btn .icon-muted {
            display: none;
        }

        .video-audio-btn.is-muted .icon-muted {
            display: block;
        }

        .video-audio-btn.is-muted .icon-unmuted {
            display: none;
        }

        .login-video-wrap.initial-thumb .video-play-center {
            display: grid;
        }

        .login-video-wrap:not(.initial-thumb) .video-play-center {
            display: none;
        }

        .login-video-wrap.video-ended .video-end-actions,
        .login-video-wrap.video-fallback .video-end-actions {
            display: flex;
        }

        body.login-open .video-play-center,
        body.login-open .login-video-wrap .video-end-actions,
        body.login-open .login-video-wrap .video-audio-controls {
            display: none;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(152, 197, 238, 0.36) 0%, rgba(152, 197, 238, 0) 72%);
            pointer-events: none;
            filter: blur(2px);
        }

        body::before {
            top: -110px;
            right: -80px;
        }

        body::after {
            bottom: -140px;
            left: -90px;
        }

        .login-container {
            position: relative;
            z-index: 20;
            width: min(460px, 100%);
            padding: clamp(1.1rem, 2vw, 1.45rem);
            background: linear-gradient(148deg, rgba(255, 255, 255, 0.82) 0%, rgba(244, 250, 255, 0.72) 100%);
            border: 1px solid rgba(168, 198, 228, 0.56);
            border-radius: 22px;
            box-shadow: 0 22px 44px rgba(72, 112, 153, 0.24);
            backdrop-filter: blur(10px) saturate(1.06);
            animation: cardIn 420ms ease-out;
            opacity: 0;
            transform: translateY(18px) scale(0.98);
            pointer-events: none;
            visibility: hidden;
            transition: opacity 240ms ease, transform 240ms ease, visibility 240ms ease;
        }

        .login-container.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            visibility: visible;
        }

        .login-header {
            padding: 0 0 16px;
            display: grid;
            gap: 6px;
            justify-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(172, 201, 230, 0.52);
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: #1e4468;
            margin: 0;
            font-size: var(--login-title-size);
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.045em;
            font-family: var(--login-brand-font);
            text-shadow: 0 8px 18px rgba(194, 218, 241, 0.66);
        }

        .login-subtitle {
            margin: 0;
            color: #496887;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .error-message {
            display: none;
            margin: 0 0 14px;
            background: rgba(253, 238, 241, 0.9);
            color: #bf2b44;
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid #f4c6ce;
            animation: slideDown 220ms ease;
            box-shadow: 0 8px 20px rgba(10, 18, 30, 0.22);
        }

        .error-message.show {
            display: block;
        }

        #loginForm {
            display: grid;
            gap: 14px;
        }

        .form-group {
            margin: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--login-text);
            font-weight: 700;
            font-size: 0.77rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: none;
        }

        .form-group input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--login-border);
            border-radius: 14px;
            font-size: 1rem;
            font-family: "Source Sans 3", sans-serif;
            color: var(--login-text);
            background: var(--login-field);
            transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.65),
                0 10px 20px rgba(93, 134, 173, 0.2);
        }

        .form-group input::placeholder {
            color: var(--login-muted);
            opacity: 0.95;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(110, 174, 234, 0.9);
            background: var(--login-field-focus);
            box-shadow:
                0 0 0 4px rgba(159, 202, 240, 0.32),
                0 12px 22px rgba(93, 134, 173, 0.22);
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-dark) 100%);
            color: #102b46;
            border: 1px solid rgba(173, 207, 238, 0.72);
            border-radius: 14px;
            font-size: 1.03rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
            font-family: "Source Sans 3", sans-serif;
            box-shadow: 0 14px 28px rgba(84, 133, 181, 0.32);
            letter-spacing: 0.03em;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 32px rgba(84, 133, 181, 0.38);
            filter: brightness(1.05);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 9px 18px rgba(84, 133, 181, 0.3);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 820px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 0.75rem;
                border-radius: 18px;
            }

            .login-header {
                padding: 0 0 14px;
            }

            .login-header h1 {
                font-size: var(--login-title-size);
            }

            .error-message {
                margin: 0 0 12px;
            }

            .form-group input {
                height: 52px;
            }

            .video-end-actions {
                top: calc(50% + 72px);
                bottom: auto;
                gap: 8px;
                padding: 8px;
                width: calc(100% - 20px);
                max-width: 420px;
            }

            .video-action-btn {
                flex: 1;
                min-height: 42px;
            }

            .video-audio-controls {
                right: 10px;
                top: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                width: 100%;
                padding: 0.7rem;
                border-radius: 14px;
            }

            .login-subtitle {
                font-size: 0.88rem;
            }

            .form-group input {
                height: 48px;
                border-radius: 12px;
                padding: 0 12px;
            }

            .login-button {
                height: 48px;
                border-radius: 12px;
                font-size: 0.96rem;
            }

            .video-play-btn {
                width: 72px;
                height: 72px;
            }

            .video-play-btn svg {
                width: 26px;
                height: 26px;
            }

            .video-end-actions {
                top: calc(50% + 66px);
                width: calc(100% - 14px);
                gap: 6px;
            }

            .video-action-btn {
                min-height: 40px;
                padding: 0 10px;
                font-size: 0.84rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-video-wrap initial-thumb" id="loginVideoWrap">
        <video
            class="login-bg-video"
            id="loginBgVideo"
            playsinline
            preload="metadata"
            poster="assets/video/Thumbnail.png"
            aria-hidden="true"
        >
            <source src="assets/video/avolta client.mp4" type="video/mp4">
        </video>
        <div class="login-end-thumb" id="loginEndThumb" aria-hidden="true"></div>
        <div class="video-play-center">
            <button type="button" class="video-play-btn" id="playVideoButton" aria-label="Play intro video" title="Play intro video">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 6v12l10-6z"></path>
                </svg>
            </button>
        </div>
        <div class="video-end-actions" id="videoEndActions">
            <button type="button" class="video-action-btn video-action-btn-continue" id="continueButton">Start Tour</button>
            <button type="button" class="video-action-btn" id="replayVideoButton">Replay</button>
        </div>
        <div class="video-audio-controls">
            <button type="button" class="video-audio-btn is-muted" id="toggleMuteButton" aria-label="Unmute video" title="Unmute video">
                <svg class="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                    <path d="M15 9c1.5 1 1.5 5 0 6"></path>
                    <path d="M18 7c3 2 3 8 0 10"></path>
                </svg>
                <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
                    <path d="m15 9 5 6"></path>
                    <path d="m20 9-5 6"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>Travel Guide</h1>
            <p class="login-subtitle">Sign in to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Enter your username" 
                    required
                    autocomplete="username"
                    maxlength="15"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                    maxlength="15"
                >
            </div>

            <button type="submit" class="login-button">Sign In</button>
        </form>
    </div>

    <script src="assets/js/login.js?v=20260225-login-stage-fix3"></script>
</body>
</html>
